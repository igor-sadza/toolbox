services:

  # ==================================================
  # toolbox 
  # ==================================================

  toolbox:
    hostname:       toolbox
    container_name: toolbox
    image:          ${TOOLBOX_IMAGE:-ghcr.io/igor-sadza/toolbox}:${TOOLBOX_VERSION:-latest}
    restart:        unless-stopped
    init:           true

    # =============================================================================
    # : Volumes
    # =============================================================================
    volumes:
      # Host home paths are identical inside toolbox.
      # (rslave: mounts made later on the host show up here too)
      - /home:/home

      # Full host filesystem escape hatch (read-write).
      - /:/host

      # Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

      # NFS shares (daemon-mounted, survive recreate/update).
      # Declare them in the top-level 'volumes:' section below.
      # - nfs-data:/mnt/nfs/data

    # =============================================================================
    # : Network 
    # =============================================================================
    network_mode: host

    # Extra Hosts 
    extra_hosts:
      - "toolbox:127.0.1.1"

    # =============================================================================
    # : Extra Settings 
    # =============================================================================
    # SYS_ADMIN + apparmor:unconfined -> ad-hoc 'sudo mount -t nfs ...'
    # and FUSE (sshfs / rclone mount) inside the container.
    cap_add:
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    devices:
      - /dev/fuse:/dev/fuse

    # =============================================================================
    # : Build 
    # =============================================================================
    # Local build only (make build / make start-local);
    # the default path is pulling the GHCR image (make start).
    build:
      dockerfile: "./Dockerfile"
      context:    "../build/"

      args:
        # -- Base
        DISTRIBUTION:           ${DISTRIBUTION}
        SUITE:                  ${SUITE}
        DIGEST:                 ${DIGEST}

        # -- Neovim
        INSTALL_NEOVIM:         ${INSTALL_NEOVIM}
        NEOVIM_VERSION:         ${NEOVIM_VERSION}
        NEOVIM_SHA256:          ${NEOVIM_SHA256}

        # -- Docker
        INSTALL_DOCKER:         ${INSTALL_DOCKER}
        DOCKER_CE_VERSION:      ${DOCKER_CE_VERSION}
        DOCKER_CE_CLI_VERSION:  ${DOCKER_CE_CLI_VERSION}
        CONTAINERD_VERSION:     ${CONTAINERD_VERSION}
        DOCKER_BUILDX_VERSION:  ${DOCKER_BUILDX_VERSION}
        DOCKER_COMPOSE_VERSION: ${DOCKER_COMPOSE_VERSION}

        # -- K9s
        INSTALL_K9S:            ${INSTALL_K9S}
        K9S_VERSION:            ${K9S_VERSION}
        K9S_SHA256:             ${K9S_SHA256}

        # -- Helm
        INSTALL_HELM:           ${INSTALL_HELM}
        HELM_VERSION:           ${HELM_VERSION}

        # -- Kubectl
        INSTALL_KUBECTL:        ${INSTALL_KUBECTL}
        KUBECTL_VERSION:        ${KUBECTL_VERSION}

        # -- Terraform
        INSTALL_TERRAFORM:      ${INSTALL_TERRAFORM}
        TERRAFORM_VERSION:      ${TERRAFORM_VERSION}

        # -- AzureCLI
        INSTALL_AZURE_CLI:      ${INSTALL_AZURE_CLI}
        AZURE_CLI_SUITE:        ${AZURE_CLI_SUITE}
        AZURE_CLI_VERSION:      ${AZURE_CLI_VERSION}

        # -- Node.js
        INSTALL_NODE_JS:        ${INSTALL_NODE_JS}
        NODE_JS_VERSION:        ${NODE_JS_VERSION}
        NODE_JS_MAJOR:          ${NODE_JS_MAJOR}

        # -- Gomplate
        INSTALL_GOMPLATE:       ${INSTALL_GOMPLATE}
        GOMPLATE_VERSION:       ${GOMPLATE_VERSION}
        GOMPLATE_SHA256:        ${GOMPLATE_SHA256}

        # -- ACT
        INSTALL_ACT:            ${INSTALL_ACT}
        ACT_VERSION:            ${ACT_VERSION}
        ACT_SHA256:             ${ACT_SHA256}

        # -- Extra packages (python; node; cargo)
        RUST_TOOLCHAIN:         ${RUST_TOOLCHAIN}
        CARGO_TREE_SITTER_CLI:  ${CARGO_TREE_SITTER_CLI}
        NPM_NEOVIM:             ${NPM_NEOVIM}
        NPM_OPENCODE_AI:        ${NPM_OPENCODE_AI}
        NPM_CODEX:              ${NPM_CODEX}
        PIPX_UV:                ${PIPX_UV}

    # =============================================================================
    # : Environments 
    # =============================================================================
    environment:
        # -- Liquidprompt
        LIQUIDPROMPT_THEME:     ${LIQUIDPROMPT_THEME}

# =============================================================================
# : Volumes (NFS example)
# -----------------------------------------------------------------------------
# : Mounted by the Docker daemon - no extra capabilities needed.
# : Prefer NFSv4 (v3 also needs rpcbind/statd).
# =============================================================================

# volumes:
