  #      - { type: 'chore',    section: '> Chores',   hidden: true }
  #      - { type: 'refactor', section: '> Refactor', hidden: true }
  #      - { type: 'test',     section: '> Tests',    hidden: true }

#-----------------------------------------------------------------------------

  # Plugin to create or update a changelog file.
  #- path: '@semantic-release/changelog'
  #  changelogFile: 'CHANGELOG.md'        

#-----------------------------------------------------------------------------

  # Plugin to execute custom shell commands.
  - path: "@semantic-release/exec"
    successCmd: >
      echo "CANIDATE=${nextRelease.version}" >> "$GITHUB_OUTPUT"

#-----------------------------------------------------------------------------

  # Plugin to commit release assets to the project's git repository.
  - path: '@semantic-release/git'
    assets: []
    #- 'CHANGELOG.md'
    message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"

#-----------------------------------------------------------------------------

  # Plugin to publish a Github release.
  - path: '@semantic-release/github'
