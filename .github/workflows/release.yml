# FILE: ./.github/workflows/release.yml
# DESC: Semantic release + publish the released image
#
############################################################

name: "release"

# ============================
# Dispatchers
# ============================

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'CHANGELOG.md'

# ============================
# Repo permissions
# ============================

permissions:
  contents:      write
  pull-requests: write
  issues:        write
  packages:      write

concurrency:
  group: release
  cancel-in-progress: false

# ============================
# Jobs
# ============================

jobs:

  # -------------
  # release
  # -------------
  release:
    # -- Metadata
    name:    Semantic Release
    runs-on: ubuntu-latest

    # -- Outputs
    outputs:
      version: ${{ steps.version.outputs.version }}

    # -- Steps
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    - name: Run semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        #GIT_AUTHOR_NAME: toolbox-release
        #GIT_AUTHOR_EMAIL: toolbox-release@users.noreply.github.com
        #GIT_COMMITTER_NAME: toolbox-release
        #GIT_COMMITTER_EMAIL: toolbox-release@users.noreply.github.com
        CI_PROJECT_NAME: ${{ github.event.repository.name }}
      run: npx --no-install semantic-release

    - name: Resolve released version
      id: version
      shell: bash
      run: |
        set -Eeuo pipefail
        tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
        echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
        echo "Released: ${tag:-<none>}"

  # -------------
  # publish
  # -------------
  publish:
    name:  Publish Release Image
    needs: release
    if:    needs.release.outputs.version != ''
    uses:  ./.github/workflows/build.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
