name: "Release"

# =================
# Triggers 
# =================

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 4 * * 1'

  workflow_dispatch:

# =================
# Settings 
# =================

permissions:
  contents: read

#concurrency:
#  group: release
#  cancel-in-progress: false

# =================
# Jobs 
# =================

jobs:

# =================
# Preflight 
# =================

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # --------------------------
      # Repository Checkout 
      # --------------------------
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --------------------------
      # Secret scans 
      # --------------------------

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --------------------------
      # Dockerfile lint 
      # --------------------------
  
      #- name: Dockerfile lint
      #  run: |
      #    docker run --rm -i hadolint/hadolint:v2.15.1 \
      #      hadolint \
      #      --ignore DL3008 \
      #      --ignore DL4006 \
      #      --ignore SC2086 \
      #      --ignore DL3003 \
      #      --ignore SC1008 \
      #      --ignore SC2174 \
      #      - < build/Dockerfile

# =================
# Release
# =================

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: preflight

    outputs:
      version: ${{ steps.semantic.outputs.version }}

    steps:

      # --------------------------
      # Repository Checkout 
      # --------------------------
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------
      # Semantic Release
      # -----------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install release dependencies
        run: npm install --no-audit --no-fund

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: | 
          npx --no-install semantic-release
          echo "version=${VERSION:=develop}" >> "${GITHUB_OUTPUT}"

# =================
# Build 
# =================

  build:
    name: Build  
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: release

    env:
      VERSION: ${{ needs.release.outputs.version }}

    steps:

      # --------------------------
      # Repository Checkout 
      # --------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --------------------------
      # Build arguments
      # --------------------------

      - name: Build arguments
        id: args
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BUILD_ARGS<<EOF"
            .cicd/github/build-args.sh .env.example
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --------------------------
      # Setup BuildKit
      # --------------------------

      - name: Setup BuildKit
        uses: docker/setup-buildx-action@v3

      # --------------------------
      # Login to GHCR
      # --------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || 'igor-sadza' }}
          password: ${{ secrets.WORKFLOW_TOKEN }}

      # --------------------------
      # Docker Build
      # --------------------------

      - name: Docker Build
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: build
          file: build/Dockerfile
          push: true 
          tags: ghcr.io/igor-sadza/toolbox:${TAG}
          build-args: ${{ steps.args.outputs.BUILD_ARGS }}
      
          # Weekly builds refresh Debian packages
          no-cache: ${{ github.event_name == 'schedule' }}
      
          # Reuse the shared develop cache
          cache-from: |
            type=gha,scope=toolbox-develop
            type=gha,scope=toolbox-${{ github.ref_name }}
      
          # Store cache separately for each branch
          cache-to: type=gha,scope=toolbox-${{ github.ref_name }},mode=max
