
name: Build

# ==========================
# Triggers
# ==========================

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop

  schedule:
    - cron: '0 4 * * 1'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'schedule' && 'develop' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.event_name != 'schedule' }}

# ==========================
# Jobs
# ==========================

jobs:
  build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # --------------------------
      # Checkout
      # --------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          persist-credentials: false

      # --------------------------
      # Build configuration
      # --------------------------

      - name: Build metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "apt_upgrade=true" >> "$GITHUB_OUTPUT"

          elif [[ "$EVENT_NAME" == "push" &&
                  "$GIT_REF" == "refs/heads/develop" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "apt_upgrade=false" >> "$GITHUB_OUTPUT"

          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "apt_upgrade=false" >> "$GITHUB_OUTPUT"
          fi

          echo "candidate=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      # --------------------------
      # Setup BuildKit
      # --------------------------

      - name: Setup BuildKit
        uses: docker/setup-buildx-action@v3

      # --------------------------
      # Build arguments
      # --------------------------

      - name: Build arguments
        id: args
        shell: bash
        env:
          APT_UPGRADE: ${{ steps.meta.outputs.apt_upgrade }}
        run: |
          set -euo pipefail

          {
            echo "BUILD_ARGS<<EOF"
            .cicd/github/build-args.sh .env.example
            echo "APT_UPGRADE=${APT_UPGRADE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --------------------------
      # Login to GHCR
      # --------------------------

      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || 'igor-sadza' }}
          password: ${{ secrets.WORKFLOW_TOKEN }}

      # --------------------------
      # Docker Build
      # --------------------------

      - name: Docker Build
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: build
          file: build/Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ghcr.io/igor-sadza/toolbox:${{ steps.meta.outputs.candidate }}
          build-args: ${{ steps.args.outputs.BUILD_ARGS }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'schedule' && 'type=gha,mode=max' || '' }}

      # --------------------------
      # Record published digest
      # --------------------------

      - name: Save build metadata
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.docker.outputs.digest }}
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
          APT_UPGRADE: ${{ steps.meta.outputs.apt_upgrade }}
        run: |
          set -euo pipefail

          mkdir -p release-metadata

          jq -n \
            --arg digest "$DIGEST" \
            --arg candidate "$CANDIDATE" \
            --arg sha "$(git rev-parse HEAD)" \
            --arg apt_upgrade "$APT_UPGRADE" \
            '{
              digest: $digest,
              candidate: $candidate,
              sha: $sha,
              apt_upgrade: $apt_upgrade
            }' > release-metadata/build.json

      - name: Upload build metadata
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: release-metadata/build.json
          retention-days: 30
