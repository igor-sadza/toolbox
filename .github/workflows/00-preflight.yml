name: "01 - Preflight"

# ==========================
# Settings
# ==========================

on:
  # Run on: Push to any 
  push:
    branches:
      - '*'

  # Run on: Pull Request 
  pull_request:
    branches:
      - develop

  # Run on: Manual trigger
  workflow_dispatch:

  # Run on: Mondays 04:00 UTC
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

# Cancel previous workflow:
concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ==========================
# Jobs 
# ==========================

jobs:

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  # --------------------------
  # Dockerfile lint 
  # --------------------------
  
      - name: Dockerfile lint
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 \
            hadolint \
            --ignore DL3008 \
            --ignore DL4006 \
            --ignore SC2086 \
            --ignore DL3003 \
            --ignore SC1008 \
            --ignore SC2174 \
            - < build/Dockerfile

  # --------------------------
  # Secret scans 
  # --------------------------

      - name: Secret scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE=$(git merge-base "$BASE_SHA" HEAD)
            LOG_OPTS="${BASE}..HEAD"
          else
            LOG_OPTS="HEAD"
          fi

          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --log-opts="$LOG_OPTS" \
            --redact \
            --verbose
